<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .contrainer{
            display: flex;
            flex-direction: column;
            /* height: 100vh; */

        }
        .header, .footer {
            background-color: #333333;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1em;
            font-size: large;
        }

        .main-content {
            padding: 1em;
            gap: 1em;
            display: flex;
            flex-direction: column;
            
            
        }

        .content , .sidebar{
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5em;
            background-color: #ccc;

        }


      

        @media (min-width:600px) {
            .main-content {
                flex-direction: row;
            }

            .content, .sidebar {
                flex-grow: 1; 
            }
            
        }

        @media (min-width: 900px) {
            .content {
                flex-grow: 3; 
            }

            .sidebar {
                flex-grow: 1;
            }
        }
    </style>
</head>
<body>
    <div class="contrainer">
        <div class="header">header</div>
        <div class="main-content">
            <div class="content">content</div>
            <div class="sidebar">sidebar</div>
        </div>
        <div class="footer">footer</div>
    </div>
</body>
</html>
