<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="profile-card">
        <div class="image">
            <img src="image.png" alt="profile" class="profile-img">
        </div>

        <div class="text-data">
            <span class="name">Im SopheakMongkul</span>
            <div class="tag">
                <span class="tag-data"  style="color:#926fd5; border-color:#926fd5; background-color:#e9d8fd;">UX/UI</span>
                <span class="tag-data" style="color:#007bff; border-color:#007bff; background-color:#d6e9ff;">AI</span>
                <span class="tag-data" style="color:#ff9800; border-color:#ff9800; background-color:#ffe0b2;">FONT END</span>    
            </div>
            <span class="bio">
                <p>
                    Programmer blending UX/UI design, AI solutions, and Front End development to create smart, seamless digital experiences.
                </p>
            </span>
        </div>

        <div class="media-button">
            <a href="#" target="_blank" style="background-color: #1877F2;" class="link">
                <i class='bx bxl-facebook'></i>
            </a>
            <a href="#" target="_blank" style="background-color: #FF0000 ;" class="link">
                <i class='bx bxl-youtube'></i>
            </a>
            <a href="#" target="_blank" style="background-color: #26A5E4;" class="link">
                <i class='bx bxl-telegram'></i>
            </a>
            <a href="#" target="_blank" style="background-color: #0A66C2;" class="link">
                <i class='bx bxl-linkedin'></i>
            </a>
        </div>
        <div class="sub-btn">
            <button class="btn" type="button">
                LEARN MORE
            </button>
        </div>

    
    </div>
</body>
</html>
