<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family:Arial, Helvetica, sans-serif;
            font-weight: 600;
            color: #fff;
        }
        .contrainer {
            display: flex;
            flex-direction: column;
            gap: 1em;
            width: 800px;
            height: 800px;
            border: 1px solid;
            padding: 1em;
        }

        .header ,.footer {
           background-color: #4169e1;
           height: 6em;
           border-radius: 0.5em;
           display: flex;
           padding-left: 2em;
           align-items: center;
           
        }

        .header {
            background-color: #1e90ff;
            box-shadow: 0 4px #0077ea;
        }

        .footer {
            background-color: #4169e1;
            box-shadow: 0 4px #1d44b8;
        }

        .content {     
            display: flex;
            flex-grow: 1;       
            gap: 1em;            
        }
        .main {
            display: flex;
            flex-wrap: wrap;
            padding: 2em;
            align-items: center;
            border-radius: 0.5em;
            background-color: #3cb371;
            box-shadow: 0 4px #2f8d59;
            gap: 1em;
        }

        .sider {
            border-radius: 0.5em;
            width: 400px;
            padding: 20px;
            background-color:  #e02200;
        }
        
        .item {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 0.5rem;
            background-color: #2f8d59;
            box-shadow: 0 4px #226741;
        }
        .label {
            width: 100%;
        }

    </style>
</head>
<body>
    
<div class="contrainer">
    <section class="header">Header</section>
    <div class="content">
        <section class="main">
            <span class="label">Main</span>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
            <div class="item">Item</div>
        </section>
        <section class="sider">Sidebar</section>
    </div>
    <section class="footer">Footer</section>
</div>

</body>
</html>
